<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Profile | JWT Spring Boot</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            padding: 20px;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                radial-gradient(
                    circle at top left,
                    #818cf8 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #c084fc 0%,
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            overflow: hidden;
        }


        /* =========================
           Background decoration
        ========================= */

        body::before,
        body::after {

            content: "";

            position: fixed;

            border-radius: 50%;

            opacity: 0.25;

            z-index: -1;
        }

        body::before {

            width: 260px;
            height: 260px;

            background: white;

            top: -90px;
            left: -90px;
        }

        body::after {

            width: 320px;
            height: 320px;

            background: #ddd6fe;

            right: -120px;
            bottom: -130px;
        }


        /* =========================
           Profile Card
        ========================= */

        .profile-box {

            width: 100%;

            max-width: 500px;

            padding: 40px;

            background:
                rgba(255, 255, 255, 0.96);

            backdrop-filter: blur(15px);

            border:
                1px solid
                rgba(255, 255, 255, 0.5);

            border-radius: 24px;

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.25),

                0 8px 20px
                rgba(0, 0, 0, 0.1);

            animation:
                fadeIn 0.6s ease;
        }


        @keyframes fadeIn {

            from {

                opacity: 0;

                transform:
                    translateY(20px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =========================
           Avatar
        ========================= */

        .avatar {

            width: 75px;
            height: 75px;

            margin:
                0 auto 18px;

            display: flex;

            justify-content: center;

            align-items: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            color: white;

            font-size: 32px;

            box-shadow:
                0 10px 25px
                rgba(
                    99,
                    102,
                    241,
                    0.35
                );
        }


        /* =========================
           Heading
        ========================= */

        h1 {

            text-align: center;

            color: #1f2937;

            font-size: 28px;

            font-weight: 700;

            margin-bottom: 7px;
        }


        .subtitle {

            text-align: center;

            color: #6b7280;

            font-size: 14px;

            margin-bottom: 30px;
        }


        /* =========================
           Message
        ========================= */

        #message {

            min-height: 22px;

            margin-bottom: 15px;

            text-align: center;

            color: #dc2626;

            font-size: 14px;

            font-weight: 500;
        }


        /* =========================
           Information
        ========================= */

        .info {

            display: flex;

            align-items: center;

            gap: 15px;

            margin-bottom: 14px;

            padding: 16px;

            background:
                #f8fafc;

            border:
                1px solid #e5e7eb;

            border-radius: 14px;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .info:hover {

            transform:
                translateY(-2px);

            border-color:
                #c7d2fe;

            box-shadow:
                0 5px 15px
                rgba(0, 0, 0, 0.06);
        }


        /* Icon */

        .info-icon {

            flex-shrink: 0;

            width: 42px;
            height: 42px;

            display: flex;

            justify-content: center;

            align-items: center;

            border-radius: 12px;

            background:
                #eef2ff;

            font-size: 20px;
        }


        .info-content {

            min-width: 0;

            flex: 1;
        }


        .label {

            color: #6b7280;

            font-size: 12px;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            margin-bottom: 5px;
        }


        .value {

            color: #1f2937;

            font-size: 16px;

            font-weight: 500;

            word-break: break-word;
        }


        .role {

            display: inline-flex;

            align-items: center;

            padding:
                5px 12px;

            border-radius: 20px;

            background:
                #eef2ff;

            color: #6366f1;

            font-size: 13px;

            font-weight: 700;
        }


        /* =========================
           Buttons
        ========================= */

        .buttons {

            display: flex;

            gap: 12px;

            margin-top: 28px;
        }


        button {

            flex: 1;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 8px;

            padding: 13px;

            border: none;

            border-radius: 12px;

            color: white;

            font-family: inherit;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }


        button:hover {

            transform:
                translateY(-2px);
        }


        button:active {

            transform:
                translateY(0);
        }


        .home-button {

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            box-shadow:
                0 8px 18px
                rgba(
                    99,
                    102,
                    241,
                    0.25
                );
        }


        .home-button:hover {

            box-shadow:
                0 12px 25px
                rgba(
                    99,
                    102,
                    241,
                    0.35
                );
        }


        .logout-button {

            background:
                linear-gradient(
                    135deg,
                    #ef4444,
                    #dc2626
                );

            box-shadow:
                0 8px 18px
                rgba(
                    220,
                    38,
                    38,
                    0.22
                );
        }


        .logout-button:hover {

            box-shadow:
                0 12px 25px
                rgba(
                    220,
                    38,
                    38,
                    0.32
                );
        }


        /* =========================
           Footer
        ========================= */

        .security {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 6px;

            margin-top: 20px;

            padding-top: 20px;

            border-top:
                1px solid #e5e7eb;

            color: #9ca3af;

            font-size: 12px;
        }


        /* =========================
           Responsive
        ========================= */

        @media (max-width: 520px) {

            body {

                padding: 15px;
            }


            .profile-box {

                padding: 30px 22px;

                border-radius: 20px;
            }


            .avatar {

                width: 65px;
                height: 65px;

                font-size: 28px;
            }


            h1 {

                font-size: 25px;
            }


            .info {

                padding: 14px;
            }


            .buttons {

                flex-direction: column;
            }


            button {

                width: 100%;
            }
        }

    </style>

</head>


<body>


<div class="profile-box">


    <!-- Avatar -->

    <div class="avatar">

        👤

    </div>


    <!-- Heading -->

    <h1>
        Thông tin tài khoản
    </h1>


    <p class="subtitle">

        Thông tin cá nhân của bạn

    </p>


    <!-- Message -->

    <div id="message"></div>


    <!-- ID -->

    <div class="info">

        <div class="info-icon">
            🆔
        </div>

        <div class="info-content">

            <div class="label">
                ID
            </div>

            <div
                    class="value"
                    id="userId"
            >
                Đang tải...
            </div>

        </div>

    </div>


    <!-- Username -->

    <div class="info">

        <div class="info-icon">
            👤
        </div>

        <div class="info-content">

            <div class="label">
                Username
            </div>

            <div
                    class="value"
                    id="username"
            >
                Đang tải...
            </div>

        </div>

    </div>


    <!-- Role -->

    <div class="info">

        <div class="info-icon">
            🛡️
        </div>

        <div class="info-content">

            <div class="label">
                Role
            </div>

            <div
                    class="value role"
                    id="role"
            >
                Đang tải...
            </div>

        </div>

    </div>


    <!-- Buttons -->

    <div class="buttons">

        <button
                type="button"
                class="home-button"
                onclick="goHome()"
        >

            🏠

            <span>
                Trang chủ
            </span>

        </button>


        <button
                type="button"
                class="logout-button"
                onclick="logout()"
        >

            🚪

            <span>
                Đăng xuất
            </span>

        </button>

    </div>


    <!-- Security -->

    <div class="security">

        🛡️

        <span>
            Tài khoản được bảo vệ bằng JWT
        </span>

    </div>


</div>


<script src="/js/profile.js"></script>


</body>

</html>
