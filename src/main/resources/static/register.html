<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký | JWT Spring Boot</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: "Segoe UI", Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at top left,
                    #818cf8 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #c084fc 0%,
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            overflow: hidden;
        }

        /* Decorative background */
        body::before,
        body::after {
            content: "";

            position: fixed;

            border-radius: 50%;

            opacity: 0.25;

            z-index: -1;
        }

        body::before {
            width: 250px;
            height: 250px;

            background: white;

            top: -80px;
            left: -80px;
        }

        body::after {
            width: 300px;
            height: 300px;

            background: #ddd6fe;

            bottom: -120px;
            right: -100px;
        }

        /* Register box */
        .register-box {
            width: 100%;
            max-width: 420px;

            padding: 40px;

            background: rgba(255, 255, 255, 0.95);

            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.5);

            border-radius: 24px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.25),
                0 8px 20px rgba(0, 0, 0, 0.1);

            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo */
        .logo {
            width: 65px;
            height: 65px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            color: white;

            font-size: 28px;

            box-shadow:
                0 10px 25px rgba(
                    99,
                    102,
                    241,
                    0.35
                );
        }

        /* Heading */
        h1 {
            text-align: center;

            color: #1f2937;

            font-size: 30px;

            font-weight: 700;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #6b7280;

            font-size: 14px;

            margin-bottom: 32px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #374151;

            font-size: 14px;

            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            color: #9ca3af;

            font-size: 17px;

            pointer-events: none;
        }

        input,
        select {
            width: 100%;

            padding: 13px 15px 13px 45px;

            border: 1.5px solid #e5e7eb;

            border-radius: 12px;

            background: #f9fafb;

            color: #1f2937;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        input::placeholder {
            color: #9ca3af;
        }

        input:hover,
        select:hover {
            border-color: #c7d2fe;
        }

        input:focus,
        select:focus {
            background: white;

            border-color: #6366f1;

            box-shadow:
                0 0 0 4px
                rgba(99, 102, 241, 0.12);
        }

        /* Select */
        select {
            cursor: pointer;

            appearance: none;

            padding-right: 40px;

            background-image:
                linear-gradient(
                    45deg,
                    transparent 50%,
                    #6b7280 50%
                ),
                linear-gradient(
                    135deg,
                    #6b7280 50%,
                    transparent 50%
                );

            background-position:
                calc(100% - 18px) 50%,
                calc(100% - 12px) 50%;

            background-size:
                6px 6px,
                6px 6px;

            background-repeat: no-repeat;
        }

        /* Password */
        .password-toggle {
            position: absolute;

            right: 14px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #9ca3af;

            cursor: pointer;

            font-size: 16px;

            padding: 5px;

            width: auto;
        }

        .password-toggle:hover {
            color: #6366f1;
        }

        #password {
            padding-right: 45px;
        }

        /* Button */
        button[type="submit"] {
            width: 100%;

            padding: 14px;

            margin-top: 5px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 8px 20px
                rgba(99, 102, 241, 0.3);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 25px
                rgba(99, 102, 241, 0.4);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        button[type="submit"]:disabled {
            background: #9ca3af;

            cursor: not-allowed;

            box-shadow: none;

            transform: none;
        }

        /* Message */
        #message {
            min-height: 22px;

            margin-top: 18px;

            text-align: center;

            font-size: 14px;

            font-weight: 500;
        }

        .success {
            color: #16a34a;
        }

        .error {
            color: #dc2626;
        }

        /* Login */
        .login {
            margin-top: 25px;

            padding-top: 22px;

            border-top: 1px solid #e5e7eb;

            text-align: center;

            color: #6b7280;

            font-size: 14px;
        }

        .login a {
            color: #6366f1;

            text-decoration: none;

            font-weight: 600;

            transition: color 0.2s ease;
        }

        .login a:hover {
            color: #4f46e5;

            text-decoration: underline;
        }

        /* Security */
        .security {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 6px;

            margin-top: 18px;

            color: #9ca3af;

            font-size: 12px;
        }

        /* Mobile */
        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .register-box {
                padding: 30px 22px;

                border-radius: 20px;
            }

            h1 {
                font-size: 26px;
            }

            .logo {
                width: 58px;
                height: 58px;

                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="register-box">

    <!-- Logo -->
    <div class="logo">
        👤
    </div>

    <!-- Heading -->
    <h1>Đăng ký</h1>

    <p class="subtitle">
        Tạo tài khoản mới để bắt đầu
    </p>

    <form id="registerForm">

        <!-- Username -->
        <div class="form-group">

            <label for="username">
                Username
            </label>

            <div class="input-wrapper">

                <span class="input-icon">
                    👤
                </span>

                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Nhập username"
                        autocomplete="username"
                        required
                >

            </div>

        </div>

        <!-- Password -->
        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="input-wrapper">

                <span class="input-icon">
                    🔒
                </span>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Nhập password"
                        autocomplete="new-password"
                        required
                >

                <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                        aria-label="Hiển thị mật khẩu"
                >
                    👁
                </button>

            </div>

        </div>

        <!-- Role -->
        <div class="form-group">

            <label for="role">
                Role
            </label>

            <div class="input-wrapper">

                <span class="input-icon">
                    🛡️
                </span>

                <select id="role">

                    <option value="USER">
                        USER
                    </option>

                    <option value="ADMIN">
                        ADMIN
                    </option>

                </select>

            </div>

        </div>

        <!-- Register button -->
        <button
                type="submit"
                id="registerButton"
        >
            Tạo tài khoản
        </button>

    </form>

    <!-- Message -->
    <div id="message"></div>

    <!-- Login -->
    <div class="login">

        Đã có tài khoản?

        <a href="/login.html">
            Đăng nhập ngay
        </a>

    </div>

    <!-- Security -->
    <div class="security">
        🛡️ Tài khoản được bảo vệ bằng JWT
    </div>

</div>

<script src="/js/register.js"></script>

<script>
    const passwordInput =
        document.getElementById("password");

    const togglePassword =
        document.getElementById("togglePassword");

    togglePassword.addEventListener(
        "click",
        function () {

            const isPassword =
                passwordInput.type === "password";

            passwordInput.type =
                isPassword
                    ? "text"
                    : "password";

            this.textContent =
                isPassword
                    ? "🙈"
                    : "👁";

            this.setAttribute(
                "aria-label",
                isPassword
                    ? "Ẩn mật khẩu"
                    : "Hiển thị mật khẩu"
            );
        }
    );
</script>

</body>
</html>
